<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="anshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="#070b14"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#anshGrad)" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Neural node connection lines -->
  <path d="M25 70 L50 25 L75 70 L50 52 Z" stroke="url(#anshGrad)" stroke-width="4" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <circle cx="50" cy="25" r="5" fill="#06b6d4"/>
  <circle cx="25" cy="70" r="5" fill="#10b981"/>
  <circle cx="75" cy="70" r="5" fill="#6366f1"/>
  <circle cx="50" cy="52" r="4" fill="#ffffff"/>
</svg>